<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <meta name="description" content="КриптоКласс — безопасное обучение цифровым активам" />
    <title>КриптоКласс</title>
    <script>
      (() => {
        const key = "crypto-education-theme";
        const saved = localStorage.getItem(key);
        const theme = saved === "light" || saved === "dark"
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const color = theme === "dark" ? "#07111f" : "#f4f7fb";
        // Opt out of Android WebView's automatic recoloring of our own themes.
        const scheme = theme === "light" ? "only light" : "only dark";
        document.documentElement.style.colorScheme = scheme;
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", scheme);
        document.documentElement.style.backgroundColor = color;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", color);
      })();
    </script>
    <script src="https://st.max.ru/js/max-web-app.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
